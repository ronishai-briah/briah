name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/trusting-galileo-5nfnos
      - claude/briaa-product-spec-cluumf
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build gantt app (root)
        run: |
          npm ci
          npm run build
      - name: Build member-app
        run: |
          cd member-app
          npm ci
          npm run build
      - name: Combine into one Pages artifact
        run: mkdir -p dist/member-app && cp -r member-app/dist/. dist/member-app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
